<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบจองที่นั่ง</title>

<style>
body{
font-family: sans-serif;
background:#f5f7fb;
margin:0;
}

h1{
text-align:center;
margin:20px;
}

.container{
display:flex;
gap:20px;
padding:20px;
}

.left{
width:250px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin-top:10px;
margin-bottom:15px;
}

button{
width:100%;
padding:10px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.room{
flex:1;
background:white;
border:3px solid #444;
border-radius:15px;
padding:20px;
position:relative;
}

.board{
background:#dff5df;
border:2px solid #70b070;
text-align:center;
padding:10px;
margin:auto;
width:80%;
border-radius:10px;
}

.teacher{
width:120px;
margin:20px auto;
background:#f7d8b7;
text-align:center;
padding:15px;
border-radius:10px;
}

.layout{
display:flex;
justify-content:space-around;
margin-top:30px;
}

.zone{
display:grid;
gap:15px;
}

.left-zone{
grid-template-columns:repeat(3,70px);
}

.middle-zone{
grid-template-columns:repeat(2,70px);
}

.right-zone{
grid-template-columns:repeat(3,70px);
}

.seat{
width:70px;
height:70px;
border-radius:10px;
border:2px solid;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-weight:bold;
}

.blue{
background:#eaf2ff;
border-color:#4b82ff;
}

.green{
background:#eef9ee;
border-color:#7cc67c;
}

.pink{
background:#ffeef5;
border-color:#ff8fb5;
}

.booked{
background:#999 !important;
color:white;
cursor:not-allowed;
}

.info{
margin-top:20px;
}

.small{
font-size:13px;
}
</style>

</head>
<body>

<h1>ระบบจองที่นั่งในห้องเรียน</h1>

<div class="container">

<div class="left">

<div class="card">
<h3>จองที่นั่ง</h3>

<input id="name" placeholder="ชื่อ-นามสกุล">

<button onclick="selectMode()">เลือกที่นั่ง</button>

</div>

<div class="card">
<button onclick="resetSeat()">รีเซ็ตทั้งหมด</button>
</div>

</div>

<div class="room">

<div class="board">กระดาน</div>

<div class="teacher">โต๊ะครู</div>

<div class="layout">

<div class="zone left-zone" id="left"></div>

<div class="zone middle-zone" id="middle"></div>

<div class="zone right-zone" id="right"></div>

</div>

</div>

</div>

<script>

let booking=false;

let seats=JSON.parse(localStorage.getItem("seatData"))||{};

function createSeat(number,color,parent){

const seat=document.createElement("div");

seat.className="seat "+color;

seat.dataset.number=number;

updateSeat(seat);

seat.onclick=function(){

if(!booking) return;

if(seats[number]) return;

const name=document.getElementById("name").value.trim();

if(name==""){
alert("กรุณากรอกชื่อ");
return;
}

seats[number]=name;

localStorage.setItem("seatData",JSON.stringify(seats));

updateSeat(seat);

booking=false;

}

parent.appendChild(seat);

}

function updateSeat(seat){

let no=seat.dataset.number;

if(seats[no]){

seat.classList.add("booked");

seat.innerHTML=no+"<br><span class='small'>"+seats[no]+"</span>";

}else{

seat.classList.remove("booked");

seat.innerHTML=no;

}

}

function selectMode(){

booking=true;

alert("คลิกเลือกที่นั่งได้เลย");

}

function resetSeat(){

if(confirm("ล้างข้อมูลทั้งหมด?")){

localStorage.removeItem("seatData");

location.reload();

}

}

const left=document.getElementById("left");
const middle=document.getElementById("middle");
const right=document.getElementById("right");

// โซนซ้าย
for(let i=1;i<=15;i++){
createSeat(i,"blue",left);
}

// โซนกลาง
for(let i=16;i<=25;i++){
createSeat(i,"green",middle);
}

// โซนขวา
for(let i=26;i<=40;i++){
createSeat(i,"pink",right);
}

</script>

</body>
</html>
